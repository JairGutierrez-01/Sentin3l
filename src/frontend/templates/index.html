<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentin3l | Read between the links</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brandbg: '#0b1120',
                        panel: '#151e2e',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>

<body class="text-slate-300 min-h-screen antialiased bg-[#080d17] bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#162238] via-[#080d17] to-[#05080f]">

    <main class="max-w-5xl mx-auto px-6 py-12 flex flex-col gap-10">

        <header class="flex items-center gap-3">
            <div class="bg-panel p-2 rounded-lg border border-slate-700/50 shadow-lg">
                <i class="ph-fill ph-shield-check text-3xl text-emerald-500"></i>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-wide flex items-center gap-4">
                Sentin3L
                <span class="w-px h-6 bg-slate-700 block"></span>
                <span class="text-slate-400 text-sm font-normal tracking-normal">Read between the links</span>
            </h1>
        </header>

        <section class="w-full flex flex-col items-center mt-4">
            <div class="relative w-full max-w-2xl">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="ph ph-link text-slate-500 text-xl"></i>
                </div>
                <input
                    type="text"
                    id="url-input"
                    placeholder="Enter a suspicious URL..."
                    class="w-full bg-[#111827]/80 backdrop-blur-md border border-slate-700 text-white rounded-xl py-4 pl-12 pr-36 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all shadow-[0_4px_20px_rgba(0,0,0,0.5)]"
                >
                <button
                    id="analyze-btn"
                    class="absolute right-2 top-2 bottom-2 bg-[#059669] hover:bg-[#047857] text-white font-semibold px-8 rounded-lg text-sm transition-all shadow-lg"
                >
                    Analyze
                </button>
            </div>
            <p class="text-slate-500 text-sm mt-4">
                Try an example: <span class="text-slate-300 font-mono cursor-pointer hover:text-emerald-400 transition-colors border-b border-slate-700 hover:border-emerald-400 border-dashed">paypal-secure-login.xyz</span>
            </p>
        </section>

        <div class="w-full h-px bg-gradient-to-r from-transparent via-slate-800 to-transparent my-2"></div>

        <section id="results-container" class="space-y-8 hidden">
            <div class="flex items-center gap-2 border-b border-slate-800 pb-2">
                <i class="ph ph-caret-right text-slate-500"></i>
                <h2 class="text-lg font-semibold text-slate-200 uppercase tracking-widest text-sm">Scan Result</h2>
            </div>

            <div id="verdict-card" class="bg-gradient-to-br from-[#2a0808] to-panel border border-red-900/50 rounded-2xl p-8 flex flex-col md:flex-row items-center gap-8 shadow-2xl relative overflow-hidden transition-all duration-500">

                <div class="relative w-48 h-24 flex-shrink-0 mt-4">
                    <svg viewBox="0 0 100 50" class="w-full h-full overflow-visible">
                        <defs>
                            <filter id="glow">
                                <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        <path d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="#2a384f" stroke-width="10" stroke-linecap="round"/>
                        <path id="gauge-arc" d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="#ef4444" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 125.6" filter="url(#glow)"/>
                    </svg>
                    <div class="absolute inset-0 flex items-center justify-center translate-y-2">
                        <span id="risk-score" class="text-5xl font-black text-white leading-none font-mono">0</span>
                    </div>
                </div>

                <div class="flex-grow text-center md:text-left">
                    <div class="flex items-center justify-center md:justify-start gap-4 mb-3">
                        <span id="score-badge" class="bg-red-500 text-white text-sm font-bold px-3 py-1 rounded font-mono shadow-md">0</span>
                        <h3 id="risk-level" class="text-3xl font-bold text-white tracking-wide uppercase">--</h3>
                    </div>
                    <p id="explanation-text" class="text-slate-200 text-lg leading-relaxed"></p>

                    <div class="mt-5 p-4 bg-slate-800/50 border border-slate-700/50 rounded-lg flex items-start gap-3 text-sm text-slate-300">
                        <i class="ph ph-shield-check text-xl text-emerald-400 mt-0.5"></i>
                        <p id="recommendation-text">Waiting for analysis...</p>
                    </div>
                </div>
            </div>

            <div>
                <h3 class="text-lg font-semibold text-slate-200 mb-4 border-b border-slate-800 pb-2">Why this matters</h3>
                <div id="flags-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                </div>
            </div>
        </section>

        <section>
            <div class="flex items-center gap-3 mb-6 border-b border-slate-800 pb-2">
                <i class="ph ph-activity text-slate-400"></i>
                <h2 class="text-lg font-semibold text-slate-200 uppercase tracking-widest text-sm">Live Activity</h2>
            </div>
            <div id="recent-carousel" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            </div>
        </section>

    </main>

    <script src="{{ url_for('static', path='js/app.js') }}"></script>
</body>
</html>
